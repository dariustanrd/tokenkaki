[project]
name = "tokenkaki"
version = "0.1.0"
description = "A staged OpenAI-compatible LLM inference gateway for serving experiments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.21.0",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenkaki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
