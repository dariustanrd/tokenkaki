[project]
name = "tokenkaki-vllm-runtime"
version = "0.1.0"
description = "Dedicated vLLM runtime environment for tokenkaki Milestone 1."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Driver 535.x is a CUDA 12.2-era data-center driver. Use a newer vLLM
    # release via its explicit CUDA 11.8 prebuilt wheel to avoid local vLLM
    # compilation and avoid CUDA 12.6/12.8/12.9 wheels that need newer drivers.
    "vllm @ https://github.com/vllm-project/vllm/releases/download/v0.9.2/vllm-0.9.2+cu118-cp38-abi3-manylinux1_x86_64.whl",
    "torch==2.7.0+cu118",
    "torchvision==0.22.0+cu118",
    "torchaudio==2.7.0+cu118",
    # Qwen3 needs transformers >=4.51. vLLM 0.9.2 collides with newer
    # transformers releases that already register config names such as aimv2.
    "transformers>=4.51.1,<4.54",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
