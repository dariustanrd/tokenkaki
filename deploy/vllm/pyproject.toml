[project]
name = "tokenkaki-vllm-runtime"
version = "0.1.0"
description = "Dedicated vLLM runtime environment for tokenkaki Milestone 1."
requires-python = ">=3.12,<3.13"
dependencies = [
    # vLLM 0.20.0+ currently requires a PyTorch line that resolves to CUDA 13
    # on this host. 0.19.1 is the newest tested release that stays on a CUDA 12
    # PyTorch stack with UV_TORCH_BACKEND=auto for the CUDA 12.2-era driver.
    "vllm==0.19.1",
]

[tool.uv]
package = false
